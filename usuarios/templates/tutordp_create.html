{% extends 'layouts/base.html' %}

{% block content %}

<main class="container py-5">
  <section class="card border-0 shadow-sm p-4">
    <h2 class="mb-4"><i class="fa fa-user-graduate fa-lg"></i> Crear Tutor</h2>

    <!-- Mensajes -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'tutordp_create' periodo_id %}" novalidate>
      {% csrf_token %}

      <!-- Datos básicos -->
      <h5 class="mt-4 text-primary">Datos personales</h5>
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">Cédula de Identidad *</label>
          <input type="text" class="form-control" name="ci" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Apellidos</label>
          <input type="text" class="form-control" name="last_name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Nombres</label>
          <input type="text" class="form-control" name="first_name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Correo Electrónico *</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" name="telefono">
        </div>
        <div class="col-md-4">
          <label class="form-label">Provincia</label>
          <input type="text" class="form-control" name="provincia">
        </div>
        <div class="col-md-4">
          <label class="form-label">Nacionalidad</label>
          <input type="text" class="form-control" name="nacionalidad">
        </div>
        <div class="col-md-4">
          <label class="form-label">Sexo</label>
          <select class="form-select" name="sexo">
            <option value="">Seleccione</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="O">Otro</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Fecha de nacimiento</label>
          <input type="date" class="form-control" name="fecha_nacimiento">
        </div>
      </div>

      

      <!-- Perfil académico -->
      <h5 class="mt-5 text-primary">Perfil académico</h5>
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label">Título de grado</label>
          <input type="text" class="form-control" name="titulo_grado">
        </div>
        <div class="col-md-4">
          <label class="form-label">Título de maestría</label>
          <input type="text" class="form-control" name="titulo_postgrado_maestria">
        </div>
        <div class="col-md-4">
          <label class="form-label">Título de doctorado</label>
          <input type="text" class="form-control" name="titulo_postgrado_doctorado">
        </div>
      </div>

      <div class="d-flex justify-content-end mt-5">
        <a href="{% url 'contratotutor_create' periodo_id %}" class="btn btn-outline-secondary me-2">
          <i class="fa fa-times"></i> Cancelar
        </a>
        <button type="submit" class="btn btn-primary">
          <i class="fa fa-save"></i> Crear tutor
        </button>
      </div>
    </form>
  </section>
</main>


{% endblock %}
