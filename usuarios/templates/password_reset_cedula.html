{% extends 'layouts/base.html' %}

{% block content %}

<body class="backlogin">

<main class="backlogin" style="align-items: center; display: flex; justify-content: center; height: 93vh;">

    <div class="col-4">
        <section class="card card-body" style="padding: 5%;">

            <div style="text-align: center; margin-bottom: 20px;">
                <img src="https://wh1043073.ispot.cc/static/posgrado.jpg" alt="Logo" class="img-fluid" style="max-width: 250px;">
            </div>

            <p style="text-align: center; font-size: 2rem;" class="display-5">
                Recuperar contraseña
            </p>

            <p class="text-muted text-center">
                Ingrese su número de cédula. Si existe una cuenta asociada, enviaremos un enlace de recuperación al correo registrado.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="cedula" class="form-label">Número de cédula</label>
                    <input type="text" class="form-control" id="cedula" name="cedula" required placeholder="Ingrese su cédula">
                </div>

                <div style="text-align: center;">
                    <button class="btn btn-lg btn-primary">
                        Enviar enlace
                    </button>
                </div>
            </form>

            <hr>

            <div style="text-align: center;">
                <a href="{% url 'signin' %}" class="text-decoration-none">
                    Volver al inicio de sesión
                </a>
            </div>

        </section>
    </div>

</main>

</body>

{% endblock %}
